plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
}

// Release signing reads from environment variables (CI) or ~/.gradle/gradle.properties (local),
// so no keystore or password is ever committed.
def signingValue = { String key -> System.getenv(key) ?: (project.findProperty(key) as String) }
def releaseKeystore = signingValue('PLANTSHOME_KEYSTORE_FILE')

android {
    namespace 'com.example.plantshome'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.plantshome'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '1.2.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword signingValue('PLANTSHOME_KEYSTORE_PASSWORD')
                keyAlias signingValue('PLANTSHOME_KEY_ALIAS')
                keyPassword signingValue('PLANTSHOME_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Set by `-Pscreenshots=<dir>` to render README screenshots (see ScreenshotTest).
                systemProperty 'plantshome.screenshots', project.findProperty('screenshots') ?: ''
            }
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // Copy and string warnings are reported, but only real errors fail the build.
        warningsAsErrors false
        // Library versions are pinned to what compileSdk 36 supports (see libs.versions.toml).
        disable 'GradleDependency', 'AndroidGradlePluginVersion'
        // Screens are portrait by design; Android ignores the lock on tablets and foldables anyway.
        disable 'LockedOrientationActivity'
        textReport true
        textOutput layout.buildDirectory.file("reports/lint-results.txt").get().asFile
    }
}

dependencies {
    implementation libs.androidx.activity
    implementation libs.androidx.appcompat
    implementation libs.androidx.cardview
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core
    implementation libs.androidx.credentials
    implementation libs.androidx.credentials.play.services
    implementation libs.androidx.exifinterface
    implementation libs.androidx.work.runtime
    implementation libs.googleid
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    // Installs the libraries' baseline profiles on sideloaded installs too, for faster start-up.
    implementation libs.androidx.profileinstaller
    implementation libs.material

    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.espresso
}
