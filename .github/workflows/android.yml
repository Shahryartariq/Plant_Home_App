name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/wrapper-validation@v5

      - uses: gradle/actions/setup-gradle@v5

      # The real Firebase config is never committed. CI uses the repo secret if set,
      # otherwise a placeholder that is only good enough to compile.
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cp .github/ci/google-services.ci.json app/google-services.json
          fi

      - name: Build debug + release, lint, unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease lintDebug testDebugUnitTest 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -E "error:|warning: \[|e: |What went wrong|> .*failed|Error:|FAILED" -A4 build.log \
            | head -150 > errors.txt || true
          split -l 25 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")
            echo "::error title=Gradle::${msg}"
          done

      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: plantshome-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
