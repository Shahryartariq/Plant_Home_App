name: Release

# Push a tag like v1.2.0 to build the app and attach it to a GitHub Release.
#
# Repository secrets used:
#   GOOGLE_SERVICES_JSON          required - the real Firebase config, so sign-in works
#   PLANTSHOME_KEYSTORE_BASE64    optional - base64 of the release keystore (.jks)
#   PLANTSHOME_KEYSTORE_PASSWORD, PLANTSHOME_KEY_ALIAS, PLANTSHOME_KEY_PASSWORD
# Without a keystore the release gets a debug-signed APK, which installs fine for trying the app.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/wrapper-validation@v5

      - uses: gradle/actions/setup-gradle@v5

      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add the GOOGLE_SERVICES_JSON repository secret first; without it the released app can't sign in."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Add signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLANTSHOME_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "PLANTSHOME_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          PLANTSHOME_KEYSTORE_PASSWORD: ${{ secrets.PLANTSHOME_KEYSTORE_PASSWORD }}
          PLANTSHOME_KEY_ALIAS: ${{ secrets.PLANTSHOME_KEY_ALIAS }}
          PLANTSHOME_KEY_PASSWORD: ${{ secrets.PLANTSHOME_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -n "${PLANTSHOME_KEYSTORE_FILE:-}" ]; then
            ./gradlew --no-daemon testDebugUnitTest assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "dist/PlantsHome-${GITHUB_REF_NAME}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "dist/PlantsHome-${GITHUB_REF_NAME}.aab"
          else
            ./gradlew --no-daemon testDebugUnitTest assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "dist/PlantsHome-${GITHUB_REF_NAME}-debug.apk"
          fi
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="fastlane/metadata/android/en-US/changelogs/$(grep -oP "versionCode \K[0-9]+" app/build.gradle).txt"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "PlantsHome $GITHUB_REF_NAME" --notes-file "$notes" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "PlantsHome $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
