name: Screenshots

# Renders the README screenshots from the app's real layouts (see ScreenshotTest)
# and commits them to docs/screenshots. Push any branch named screenshots/<something>
# to run it, then merge that branch.
on:
  push:
    branches: ['screenshots/**']

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/wrapper-validation@v5

      - uses: gradle/actions/setup-gradle@v5

      - name: Add placeholder Firebase config
        run: cp .github/ci/google-services.ci.json app/google-services.json

      - name: Render screenshots
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests 'com.example.plantshome.ScreenshotTest' \
            -Pscreenshots="$GITHUB_WORKSPACE/docs/screenshots" 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          grep -E "error:|FAILED|Exception|What went wrong|at com\.example" -A3 build.log | head -120 > errors.txt || true
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            grep -A8 '<failure' "$f" | head -40 >> errors.txt || true
          done
          split -l 25 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")
            echo "::error title=Screenshots::${msg}"
          done

      - name: Commit screenshots
        run: |
          ls -la docs/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Update README screenshots"
          git push
